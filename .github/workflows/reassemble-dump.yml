name: Temporary ROS64 dump reassembly

on:
  push:
    branches:
      - ai/reassemble-dump-20261024

permissions:
  contents: read

jobs:
  reassemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout split archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install archive verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Verify archive, extract dump, and split it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/extracted work/dump-parts

          {
            echo "Repository: aisalesorganizer-droid/ROSL-DUMPS"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "PART SIZE AND SHA-256"
            for f in ros64.z01 ros64.z02 ros64.z03 ros64.z04 ros64.z05 ros64.z06 ros64.zip; do
              test -f "$f" || { echo "MISSING: $f"; exit 10; }
              stat -c '%n %s bytes' "$f"
              sha256sum "$f"
            done
          } | tee work/parts-manifest.txt

          7z t ros64.zip > work/original-volume-test.txt 2>&1
          cat work/original-volume-test.txt
          7z l -slt ros64.zip > work/archive-listing.txt 2>&1

          7z x ros64.zip -owork/extracted -y > work/extraction-test.txt 2>&1
          cat work/extraction-test.txt
          test -f work/extracted/ros64.dmp
          test "$(stat -c %s work/extracted/ros64.dmp)" -gt 0

          DUMP=work/extracted/ros64.dmp
          sha256sum "$DUMP" | tee work/dump-sha256.txt
          stat -c 'Extracted dump: %n %s bytes' "$DUMP" | tee work/dump-size.txt

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path("work/extracted/ros64.dmp")
          out = Path("work/dump-parts")
          out.mkdir(parents=True, exist_ok=True)
          chunk_size = 500_000_000
          index = 0
          with source.open("rb") as src:
              while True:
                  block = src.read(chunk_size)
                  if not block:
                      break
                  target = out / f"ros64.dmp.part{index:02d}"
                  target.write_bytes(block)
                  print(f"{target} {len(block)} bytes sha256={hashlib.sha256(block).hexdigest()}")
                  index += 1
          if index != 4:
              raise SystemExit(f"Expected 4 parts for this dump size; got {index}")
          original_size = source.stat().st_size
          parts_size = sum(p.stat().st_size for p in sorted(out.glob("ros64.dmp.part*")))
          if original_size != parts_size:
              raise SystemExit(f"Size mismatch: original={original_size}, parts={parts_size}")
          print(f"PARTITION_OK original={original_size} parts={parts_size} count={index}")
          PY

          {
            echo "Original dump SHA-256:"
            cat work/dump-sha256.txt
            echo
            echo "Original dump size:"
            cat work/dump-size.txt
            echo
            echo "Parts:"
            sha256sum work/dump-parts/ros64.dmp.part*
            stat -c '%n %s bytes' work/dump-parts/ros64.dmp.part*
          } > work/dump-parts-manifest.txt

      - name: Inspect minidump and entity-discovery addresses
        shell: bash
        run: |
          python3 - <<'PY' | tee work/entity-discovery-memory-report.txt
          import bisect, struct, time
          from pathlib import Path

          path = Path("work/extracted/ros64.dmp")
          size = path.stat().st_size
          names = {
              3: "ThreadList", 4: "ModuleList", 5: "MemoryList", 6: "Exception",
              7: "SystemInfo", 8: "ThreadExList", 9: "Memory64List",
              10: "CommentA", 11: "CommentW", 12: "HandleData",
              13: "FunctionTable", 14: "UnloadedModuleList", 15: "MiscInfo",
              16: "MemoryInfoList", 17: "ThreadInfoList", 18: "HandleOperationList",
              19: "Token", 20: "JavaScriptData", 21: "SystemMemoryInfo",
              22: "ProcessVmCounters", 23: "IptTrace"
          }
          regions = []

          print("=== DUMP HEADER ===")
          print(f"path={path} fileSize={size}")
          with path.open("rb") as f:
              header = f.read(32)
              print(f"first32={header.hex(' ')}")
              if len(header) != 32 or header[:4] != b"MDMP":
                  print("FORMAT=NOT_WINDOWS_MINIDUMP_OR_HEADER_UNAVAILABLE")
                  raise SystemExit(0)
              version, count, directory_rva, checksum, timestamp, flags = struct.unpack_from("<IIIIIQ", header, 4)
              print(f"signature=MDMP version=0x{version:X} streamCount={count} directoryRva=0x{directory_rva:X} checksum=0x{checksum:X} timestamp=0x{timestamp:X} flags=0x{flags:X}")
              if count > 100000 or directory_rva + count * 12 > size:
                  print("ERROR=invalid stream directory bounds")
                  raise SystemExit(0)
              streams = {}
              for i in range(count):
                  f.seek(directory_rva + i * 12)
                  stype, data_size, rva = struct.unpack("<III", f.read(12))
                  print(f"stream[{i}] type={stype} name={names.get(stype, 'Unknown')} size={data_size} rva=0x{rva:X}")
                  if rva + data_size <= size:
                      streams.setdefault(stype, []).append((data_size, rva))
              # Memory64List is preferred because it provides contiguous raw-memory data.
              if 9 in streams:
                  data_size, rva = streams[9][0]
                  f.seek(rva)
                  raw = f.read(16)
                  if len(raw) == 16:
                      n, base_rva = struct.unpack("<QQ", raw)
                      if n <= 2_000_000 and 16 + n * 16 <= data_size:
                          f.seek(rva + 16)
                          cursor = base_rva
                          for _ in range(n):
                              start, length = struct.unpack("<QQ", f.read(16))
                              if start + length <= 0x10000000000000000 and cursor + length <= size:
                                  regions.append((start, start + length, cursor, length))
                              cursor += length
                          print(f"MEMORY64 rangesDeclared={n} baseRva=0x{base_rva:X} validRanges={len(regions)}")
              if not regions and 5 in streams:
                  data_size, rva = streams[5][0]
                  f.seek(rva)
                  raw = f.read(4)
                  if len(raw) == 4:
                      n = struct.unpack("<I", raw)[0]
                      if n <= 2_000_000 and 4 + n * 16 <= data_size:
                          f.seek(rva + 4)
                          for _ in range(n):
                              start, length, mem_rva = struct.unpack("<QII", f.read(16))
                              if mem_rva + length <= size:
                                  regions.append((start, start + length, mem_rva, length))
                          print(f"MEMORYLIST rangesDeclared={n} validRanges={len(regions)}")
              if not regions:
                  print("ERROR=no usable Memory64ListStream or MemoryListStream found")
                  raise SystemExit(0)
              regions.sort(key=lambda x: x[0])
              starts = [r[0] for r in regions]
              covered = sum(r[3] for r in regions)
              print(f"memoryRanges={len(regions)} mappedBytes={covered} firstVA=0x{regions[0][0]:X} lastVAEnd=0x{regions[-1][1]:X}")

              def read_va(va, n):
                  idx = bisect.bisect_right(starts, va) - 1
                  if idx < 0:
                      return None
                  start, end, file_offset, length = regions[idx]
                  if va < start or va + n > end:
                      return None
                  f.seek(file_offset + (va - start))
                  b = f.read(n)
                  return b if len(b) == n else None

              def q(va):
                  b = read_va(va, 8)
                  return struct.unpack("<Q", b)[0] if b else None

              def d(va):
                  b = read_va(va, 4)
                  return struct.unpack("<I", b)[0] if b else None

              def dump_qwords(label, va, count=8):
                  print(f"-- {label} VA=0x{va:X} --")
                  b = read_va(va, count * 8)
                  if not b:
                      print("UNMAPPED_OR_CROSSES_RANGE")
                      return
                  vals = struct.unpack("<" + "Q" * count, b)
                  for i, val in enumerate(vals):
                      addr = va + i * 8
                      print(f"  +0x{i*8:03X} [0x{addr:X}] = 0x{val:016X} mappedTarget={'yes' if (val and read_va(val, 8)) else 'no'}")

              def dump_bytes(label, va, n=0x40):
                  print(f"-- {label} VA=0x{va:X} bytes={n} --")
                  b = read_va(va, n)
                  if b is None:
                      print("UNMAPPED_OR_CROSSES_RANGE")
                  else:
                      for i in range(0, len(b), 16):
                          chunk = b[i:i+16]
                          print(f"  +0x{i:03X}: {chunk.hex(' ')}  {''.join(chr(x) if 32 <= x < 127 else '.' for x in chunk)}")

              print("=== STATIC ENTITY MANAGER POINTER ===")
              em_slot = 0x1431F53D8
              dump_bytes("EM pointer slot", em_slot, 0x20)
              em = q(em_slot)
              print(f"emPointerSlotVA=0x{em_slot:X} value={('0x%X' % em) if em is not None else 'UNMAPPED'}")
              if em is None or em == 0 or read_va(em, 8) is None:
                  print("ENTITY_MANAGER_POINTER_NOT_MAPPED; no dependent pointer is treated as valid")
                  raise SystemExit(0)

              print("=== ENTITY MANAGER FIELDS ===")
              dump_qwords("EntityManager+0x10D0", em + 0x10D0, 8)
              tree_field = em + 0x10E0
              tree_candidate = q(tree_field)
              dump_qwords("EntityManager all-entities field bytes", tree_field, 8)
              print(f"EM_ALL_ENTITIES_FIELD=0x{tree_field:X} firstQword={('0x%X' % tree_candidate) if tree_candidate is not None else 'UNMAPPED'}")
              if tree_candidate and read_va(tree_candidate, 8):
                  dump_qwords("All-entities candidate target", tree_candidate, 12)
                  dump_bytes("All-entities candidate target bytes", tree_candidate, 0x80)

              controlled_field = em + 0x10F8
              controlled = q(controlled_field)
              print(f"CONTROLLED_ENTITIES_FIELD=0x{controlled_field:X} value={('0x%X' % controlled) if controlled is not None else 'UNMAPPED'}")
              dump_qwords("EntityManager controlledEntities field", controlled_field, 6)
              if not controlled or read_va(controlled + 0x8, 8) is None:
                  print("CONTROLLED_ENTITIES_CHAIN_NOT_MAPPED")
                  raise SystemExit(0)

              controlled_tree = q(controlled + 0x8)
              print(f"CONTROLLED_TREE_CANDIDATE={('0x%X' % controlled_tree) if controlled_tree is not None else 'UNMAPPED'}")
              if not controlled_tree or read_va(controlled_tree + 0x20, 8) is None:
                  print("CONTROLLED_TREE_ROOT_NOT_MAPPED")
                  raise SystemExit(0)
              dump_qwords("Controlled-tree candidate", controlled_tree, 10)
              local_avatar = q(controlled_tree + 0x20)
              print(f"LOCAL_AVATAR_CANDIDATE={('0x%X' % local_avatar) if local_avatar is not None else 'UNMAPPED'}")
              if not local_avatar or read_va(local_avatar + 0x1B0, 8) is None:
                  print("LOCAL_AVATAR_DICTIONARY_FIELD_NOT_MAPPED")
                  raise SystemExit(0)
              dump_qwords("Local avatar start", local_avatar, 8)
              player_dict = q(local_avatar + 0x1B0)
              print(f"PLAYER_DICT_CANDIDATE={('0x%X' % player_dict) if player_dict is not None else 'UNMAPPED'}")
              if not player_dict or read_va(player_dict + 0x28, 8) is None:
                  print("PLAYER_DICT_HEADER_NOT_MAPPED")
                  raise SystemExit(0)

              def inspect_dict(label, dict_ptr, slot_decimal=None):
                  used = q(dict_ptr + 0x18)
                  mask = q(dict_ptr + 0x20)
                  table = q(dict_ptr + 0x28)
                  print(f"{label}: ptr=0x{dict_ptr:X} used={used} mask={mask} table={('0x%X' % table) if table is not None else 'UNMAPPED'}")
                  if used is None or mask is None or table is None or mask > 0xFFFF or table == 0:
                      print(f"{label}: invalid or unverified dictionary header")
                      return None
                  if read_va(table, min((mask + 1) * 24, 0x100000)) is None:
                      print(f"{label}: table is not fully readable in one range or has unverified bounds")
                  table_bytes = read_va(table, (mask + 1) * 24)
                  if table_bytes is None:
                      print(f"{label}: full table read failed")
                      return None
                  active = []
                  for i in range(mask + 1):
                      h, key_ptr, value_ptr = struct.unpack_from("<QQQ", table_bytes, i * 24)
                      if key_ptr and value_ptr:
                          active.append((i, h, key_ptr, value_ptr))
                  unique_values = len({e[3] for e in active})
                  print(f"{label}: occupiedKeyValueEntries={len(active)} uniqueValuePointers={unique_values} matchesUsed={len(active)==used}")
                  if slot_decimal is not None:
                      slot_va = table + slot_decimal * 24
                      entry = read_va(slot_va, 24)
                      print(f"{label}: decimalSlot={slot_decimal} byteOffset=0x{slot_decimal*24:X} entryVA=0x{slot_va:X}")
                      if entry:
                          h, key_ptr, value_ptr = struct.unpack("<QQQ", entry)
                          print(f"{label}: slotHash=0x{h:X} keyPtr=0x{key_ptr:X} valuePtr=0x{value_ptr:X}")
                          if key_ptr:
                              kb = read_va(key_ptr, 0x60)
                              print(f"{label}: slotKeyObjectBytes={kb.hex(' ') if kb else 'UNMAPPED'}")
                              print(f"{label}: keyObjectContainsAvatarInAoI={bool(kb and (b'avatarInAoI' in kb or 'avatarInAoI'.encode('utf-16le') in kb))}")
                          return value_ptr if value_ptr else None
                  for i, h, kp, vp in active[:40]:
                      print(f"  entry[{i}] hash=0x{h:X} key=0x{kp:X} value=0x{vp:X} valueMapped={'yes' if read_va(vp,8) else 'no'}")
                  return None

              print("=== PLAYER DICTIONARY ===")
              aoi_dict = inspect_dict("PLAYER_DICT", player_dict, 770)
              if aoi_dict and read_va(aoi_dict + 0x28, 8) is not None:
                  print("=== AOI DICTIONARY CANDIDATE FROM DECIMAL SLOT 770 ===")
                  inspect_dict("AOI_DICT", aoi_dict)
              else:
                  print("AOI_DICTIONARY_NOT_ESTABLISHED_FROM_SLOT_770")
          PY

          {
            echo "Original dump SHA-256:"
            cat work/dump-sha256.txt
            echo
            echo "Original dump size:"
            cat work/dump-size.txt
            echo
            echo "Parts:"
            cat work/dump-parts-manifest.txt
          } > work/dump-parts-manifest-with-hashes.txt

      - name: Scan memory for live instances of the controlled avatar type
        shell: bash
        run: |
          python3 - <<'PY' | tee work/entity-instance-scan.txt
          import bisect, struct
          from pathlib import Path

          path = Path("work/extracted/ros64.dmp")
          size = path.stat().st_size
          regions = []
          with path.open("rb") as f:
              if f.read(4) != b"MDMP":
                  raise SystemExit("INVALID_MINIDUMP_SIGNATURE")
              f.seek(4)
              version, count, directory_rva, checksum, timestamp = struct.unpack("<IIIII", f.read(20))
              f.seek(directory_rva)
              streams = {}
              for _ in range(count):
                  kind, data_size, rva = struct.unpack("<III", f.read(12))
                  if rva + data_size <= size:
                      streams.setdefault(kind, []).append((data_size, rva))
              if 9 not in streams:
                  raise SystemExit("NO_MEMORY64_LIST")
              data_size, rva = streams[9][0]
              f.seek(rva)
              n, base_rva = struct.unpack("<QQ", f.read(16))
              f.seek(rva + 16)
              cursor = base_rva
              for _ in range(n):
                  va, length = struct.unpack("<QQ", f.read(16))
                  if cursor + length <= size:
                      regions.append((va, va + length, cursor, length))
                  cursor += length
          regions.sort(key=lambda x: x[0])
          starts = [x[0] for x in regions]

          def read_va(va, length):
              i = bisect.bisect_right(starts, va) - 1
              if i < 0:
                  return None
              start, end, fileoff, rlen = regions[i]
              if va < start or va + length > end:
                  return None
              with path.open("rb") as f:
                  f.seek(fileoff + va - start)
                  b = f.read(length)
              return b if len(b) == length else None

          def q(va):
              b = read_va(va, 8)
              return struct.unpack("<Q", b)[0] if b else None

          def u32(va):
              b = read_va(va, 4)
              return struct.unpack("<I", b)[0] if b else None

          def f32(va):
              b = read_va(va, 4)
              return struct.unpack("<f", b)[0] if b else None

          def dict_info(obj):
              dp = q(obj + 0x1B0)
              if not dp or read_va(dp + 0x28, 8) is None:
                  return None
              used, mask, table = q(dp+0x18), q(dp+0x20), q(dp+0x28)
              if used is None or mask is None or table is None or mask > 0xFFFF or used > mask + 1 or not table:
                  return None
              if read_va(table, 24) is None:
                  return None
              return dp, used, mask, table

          em = q(0x1431F53D8)
          if em is None:
              raise SystemExit("ENTITY_MANAGER_POINTER_SLOT_UNMAPPED")
          controlled = q(em + 0x10F8)
          tree_candidate = q(controlled + 0x8) if controlled else None
          avatar = q(tree_candidate + 0x20) if tree_candidate else None
          type_ptr = q(avatar + 0x8) if avatar else None

          print(f"DUMP_TIMESTAMP_UTC={__import__('datetime').datetime.fromtimestamp(timestamp, __import__('datetime').timezone.utc).isoformat()}")
          print(f"EM=0x{em:X} controlledContainer={('0x%X'%controlled) if controlled else 'UNMAPPED'} treeCandidate={('0x%X'%tree_candidate) if tree_candidate else 'UNMAPPED'} localAvatar={('0x%X'%avatar) if avatar else 'UNMAPPED'} typePointer={('0x%X'%type_ptr) if type_ptr else 'UNMAPPED'}")
          print("=== GLOBAL TREE CANDIDATE ===")
          for offset in range(0, 0x60, 8):
              val = q(0x17A727E0 + offset)
              print(f"0x17A727E0+0x{offset:02X} = {('0x%016X'%val) if val is not None else 'UNMAPPED'}")
          print("=== CONTROLLED CONTAINER ===")
          if controlled:
              for offset in range(0, 0x80, 8):
                  val = q(controlled + offset)
                  print(f"0x{controlled:X}+0x{offset:02X} = {('0x%016X'%val) if val is not None else 'UNMAPPED'}")

          if not type_ptr or read_va(type_ptr + 0x18, 8) is None:
              raise SystemExit("LOCAL_AVATAR_TYPE_LAYOUT_UNVERIFIED")
          name_ptr = q(type_ptr + 0x18)
          name_raw = read_va(name_ptr, 128) if name_ptr else None
          name = name_raw.split(b"\0", 1)[0].decode("ascii", "replace") if name_raw else "UNREADABLE"
          print(f"PYTYPE=0x{type_ptr:X} tp_name_ptr={('0x%X'%name_ptr) if name_ptr else 'UNMAPPED'} tp_name={name}")
          print(f"LOCAL_AVATAR_REFCOUNT={q(avatar)} entityIdDwordAt+0x18={('0x%08X'%u32(avatar+0x18)) if u32(avatar+0x18) is not None else 'UNMAPPED'} dict={dict_info(avatar)}")

          # Enumerate AOI dictionary slots by verified value type, not by nonzero bytes alone.
          player_dict = q(avatar + 0x1B0) if avatar else None
          aoi = None
          if player_dict:
              used, mask, table = q(player_dict+0x18), q(player_dict+0x20), q(player_dict+0x28)
              if mask is not None and mask <= 0xFFFF and table:
                  entry = read_va(table + 770 * 24, 24)
                  if entry:
                      _, key_ptr, aoi_candidate = struct.unpack("<QQQ", entry)
                      kraw = read_va(key_ptr, 64) if key_ptr else None
                      if kraw and b"avatarInAoI" in kraw:
                          aoi = aoi_candidate
          aoi_matches = []
          if aoi:
              a_used, a_mask, a_table = q(aoi+0x18), q(aoi+0x20), q(aoi+0x28)
              print(f"AOI_DICT=0x{aoi:X} used={a_used} mask={a_mask} table={('0x%X'%a_table) if a_table else 'UNMAPPED'}")
              if a_mask is not None and a_mask <= 0xFFFF and a_table:
                  for i in range(a_mask + 1):
                      row = read_va(a_table + i*24, 24)
                      if not row:
                          continue
                      h, kp, vp = struct.unpack("<QQQ", row)
                      if vp and q(vp+8) == type_ptr:
                          info = dict_info(vp)
                          eid = u32(vp+0x18)
                          aoi_matches.append((i,h,kp,vp,eid,info))
              print(f"AOI_typeMatches={len(aoi_matches)} uniquePointers={len({x[3] for x in aoi_matches})} uniqueIds={len({x[4] for x in aoi_matches if x[4] is not None})}")
              for entry in aoi_matches:
                  i,h,kp,vp,eid,info=entry
                  print(f"AOI_SLOT={i} hash=0x{h:X} key=0x{kp:X} avatar=0x{vp:X} id=0x{eid:08X} dict={info}")
          else:
              print("AOI_DICT_NOT_RESOLVED_FROM_VERIFIED_SLOT_770")

          # Search every captured memory range for the exact PyObject.ob_type pointer at object+8.
          # Candidates are retained only when refcount, entity id, and an instance dictionary header agree.
          pattern = struct.pack("<Q", type_ptr)
          candidates = {}
          block_size = 16 * 1024 * 1024
          with path.open("rb") as f:
              for va_start, va_end, fileoff, length in regions:
                  offset = 0
                  overlap = b""
                  while offset < length:
                      take = min(block_size, length - offset)
                      f.seek(fileoff + offset)
                      data = f.read(take)
                      if not data:
                          break
                      combined = overlap + data
                      combined_va = va_start + offset - len(overlap)
                      pos = combined.find(pattern)
                      while pos >= 0:
                          type_va = combined_va + pos
                          object_va = type_va - 8
                          if object_va >= va_start and object_va + 0x1B8 <= va_end:
                              refcnt = q(object_va)
                              eid = u32(object_va + 0x18)
                              info = dict_info(object_va)
                              if refcnt is not None and 0 < refcnt <= 1_000_000 and eid not in (None, 0) and info:
                                  candidates[object_va] = (refcnt, eid, info)
                          pos = combined.find(pattern, pos + 1)
                      overlap = combined[-7:] if len(combined) >= 7 else combined
                      offset += take
          # Keep only the first 256 records in text output; summary counts use all verified records.
          unique_ids = {record[1] for record in candidates.values()}
          print("=== GLOBAL INSTANCE CENSUS ===")
          print(f"exactTypePointerHitsWithPlausibleObjectAndDict={len(candidates)} uniqueEntityIds={len(unique_ids)}")
          print(f"AOI_pointerCount={len({x[3] for x in aoi_matches}) if aoi else 0} globalPointersOutsideAOI={len(set(candidates)-{x[3] for x in aoi_matches})}")
          for obj,(refcnt,eid,info) in sorted(candidates.items())[:256]:
              x,y,z = f32(obj+0x1C), f32(obj+0x20), f32(obj+0x24)
              print(f"AVATAR_INSTANCE ptr=0x{obj:X} refcnt={refcnt} id=0x{eid:08X} xyzCandidate=({x},{y},{z}) dict={info}")
          PY

      - name: Upload dump part 00
        uses: actions/upload-artifact@v4
        with:
          name: ros64-dmp-part00
          path: work/dump-parts/ros64.dmp.part00
          compression-level: 0
          if-no-files-found: error

      - name: Upload dump part 01
        uses: actions/upload-artifact@v4
        with:
          name: ros64-dmp-part01
          path: work/dump-parts/ros64.dmp.part01
          compression-level: 0
          if-no-files-found: error

      - name: Upload dump part 02
        uses: actions/upload-artifact@v4
        with:
          name: ros64-dmp-part02
          path: work/dump-parts/ros64.dmp.part02
          compression-level: 0
          if-no-files-found: error

      - name: Upload dump part 03
        uses: actions/upload-artifact@v4
        with:
          name: ros64-dmp-part03
          path: work/dump-parts/ros64.dmp.part03
          compression-level: 0
          if-no-files-found: error

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: ros64-dmp-analysis-reports
          path: |
            work/parts-manifest.txt
            work/original-volume-test.txt
            work/archive-listing.txt
            work/extraction-test.txt
            work/dump-sha256.txt
            work/dump-size.txt
            work/dump-parts-manifest-with-hashes.txt
            work/entity-discovery-memory-report.txt
            work/entity-instance-scan.txt
          compression-level: 0
          if-no-files-found: error
